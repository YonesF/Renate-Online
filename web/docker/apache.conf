ServerName localhost
ServerTokens Prod
ServerSignature Off

# Én vert tar imot alle Host-headere. configuration/hostmap.php velger nettsted.
<VirtualHost *:80>
    DocumentRoot /app/web/public

    <Directory /app/web/public>
        Require all granted
        AllowOverride None
        Options -Indexes
        FallbackResource /index.php
    </Directory>
</VirtualHost>
