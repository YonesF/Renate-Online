[package]
name = "search"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.9"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
